name: Validate Skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate skill catalog
        run: python3 scripts/validate_skills.py

      - name: Test catalog and replacement recovery
        run: python3 scripts/test_catalog.py

      - name: Validate installer paths
        run: |
          python3 scripts/install_skills.py --list-collections
          python3 scripts/install_skills.py --dry-run

      - name: Compile maintainer scripts
        run: python3 -m py_compile scripts/*.py

      - name: Check whitespace
        run: git diff --check
